  <div class="prog"><span id="progtxt">0 / 0</span><div class="bar"><i id="progbar"></i></div></div>

<div class="panel" id="workpanel" hidden><div role="dialog" aria-modal="true" aria-labelledby="wph"><h3 id="wph" style="margin-top:0">My work</h3><p class="small">Everything you wrote in this session. Copy it into a document or email if you want to keep it or hand it in. Nothing is saved when you leave the page.</p><textarea id="worktext" readonly></textarea><div class="btns"><button class="btn" id="workcopy">Copy all</button><button class="btn sec" id="workclose">Close</button></div></div></div>

<script>
/* =========================================================
   CONTENT
   ========================================================= */
const MODULES = [
{ id:'intro', title:'Welcome & the research loop', html:`
<h2>Welcome</h2>
<p class="lead">This tutorial shows you how to use AI in a sound legal research process. You'll frame the question, choose the right source, retrieve authority, evaluate the answer, and verify the law.</p>
<div class="callout"><strong>Ground rule.</strong> A strong prompt helps a tool understand the assignment. It does not make the answer authoritative. Treat AI output as a research aid until you have read the underlying sources and confirmed that the law is current.</div>
<div class="card">
<h4 style="margin-top:0">How this tutorial works</h4>
<ul>
<li>Work through the lessons in order or jump around using the menu.</li>
<li>Exercises give instant feedback. You can retry any of them.</li>
<li>Writing exercises use <em>automated pattern feedback</em>. It checks whether your prompt includes the features of a strong prompt, but it can't judge legal accuracy. Compare your draft with the model answer.</li>
<li><strong>Nothing you type is saved or sent anywhere.</strong> Reloading the page clears your work. Use <em>My work</em> (top right) to see and copy everything you wrote.</li>
<li>Case names in simulated AI responses are <strong>fictional</strong> and exist only for training.</li>
</ul>
</div>
<h3>Prompting is one step in a six-stage research loop</h3>
<div class="tablewrap"><table>
<tr><th>Stage</th><th>Student action</th><th>AI can help with</th><th>Student must verify</th></tr>
<tr><td><strong>1. Frame</strong></td><td>Identify jurisdiction, facts, posture, and research question.</td><td>Issue spotting; clarifying questions.</td><td>That the question is legally and factually accurate.</td></tr>
<tr><td><strong>2. Plan</strong></td><td>Choose sources and search strategy.</td><td>Terms of art; synonyms; source suggestions.</td><td>Appropriate databases, authority hierarchy, and research scope.</td></tr>
<tr><td><strong>3. Retrieve</strong></td><td>Locate potentially relevant authority.</td><td>AI-assisted search in legal databases.</td><td>Existence, relevance, jurisdiction, and source type.</td></tr>
<tr><td><strong>4. Read</strong></td><td>Read the authorities.</td><td>Summaries, comparisons, extraction.</td><td>Holding, rule, reasoning, quotations, posture, and facts.</td></tr>
<tr><td><strong>5. Update &amp; synthesize</strong></td><td>Update authorities and reconcile them.</td><td>Charts; rule synthesis; counterarguments.</td><td>Treatment, current validity, conflicts, and omitted authority.</td></tr>
<tr><td><strong>6. Communicate</strong></td><td>Draft the research answer.</td><td>Outline, memo, explanation, editing.</td><td>Every material proposition and citation in the final work.</td></tr>
</table></div>
<div class="callout"><strong>Classroom rule:</strong> AI may suggest the path. Primary and authoritative sources establish the law.</div>
<div data-ex="loop"></div>
`},
{ id:'task', title:'Start with the task', html:`
<h2>Start with the research task, not the AI tool</h2>
<p class="lead">Before you prompt, decide what you are trying to accomplish. The prompt should fit the task.</p>
<div class="tablewrap"><table>
<tr><th>Task</th><th>What it means</th></tr>
<tr><td><strong>Issue spotting</strong></td><td>Identify possible claims, defenses, elements, or legal questions.</td></tr>
<tr><td><strong>Research planning</strong></td><td>Generate terminology, synonyms, sources, and a search sequence.</td></tr>
<tr><td><strong>Authority research</strong></td><td>Locate cases, statutes, regulations, rules, and secondary sources.</td></tr>
<tr><td><strong>Source analysis</strong></td><td>Summarize, compare, or extract rules from materials you provide or retrieve.</td></tr>
<tr><td><strong>Synthesis</strong></td><td>Organize authorities, distinguish cases, identify conflicts, and explain how rules fit together.</td></tr>
<tr><td><strong>Drafting</strong></td><td>Turn verified research into an outline, memo, chart, email, or other work product.</td></tr>
</table></div>
<p>A brainstorming prompt written for a general AI assistant shouldn't be copied unchanged into a legal research database. A one-sentence database query usually isn't enough for a complex drafting agent.</p>
<div data-ex="tasks"></div>
`},
{ id:'frameworks', title:'Two general frameworks', html:`
<h2>Two general prompting frameworks</h2>
<p class="lead">Most prompting advice reduces to two patterns. Use Framework A for ordinary chat, analysis, and document tasks. Use Framework B when the tool will carry out a longer or more autonomous assignment.</p>
<h3>Framework A: Task + Context + Constraints + Output</h3>
<p>Use this for general-purpose AI such as ChatGPT, Claude, Gemini, or Copilot, and for many legal drafting or document-analysis tasks.</p>
<div class="tablewrap"><table>
<tr><th>Component</th><th>Ask yourself</th><th>Legal-research example</th></tr>
<tr><td><strong>Task</strong></td><td>What should the AI do?</td><td>Identify the elements of a claim and generate research terms.</td></tr>
<tr><td><strong>Context</strong></td><td>What facts, documents, audience, or purpose matter?</td><td>California state-court dispute; tenant withheld rent after six weeks without heat.</td></tr>
<tr><td><strong>Constraints</strong></td><td>What boundaries must the answer respect?</td><td>Do not invent or cite cases; distinguish statutes from inferences; use only the uploaded materials.</td></tr>
<tr><td><strong>Output</strong></td><td>What form should the answer take?</td><td>Table with Issue, Rule to Research, and Search Terms.</td></tr>
</table></div>
<div class="prompt better"><span class="tag better">Example</span>
Task: Identify the legal issues and possible claims or defenses raised by these facts.
Context: A California residential tenant withheld rent after the landlord failed to repair a broken heater for six weeks.
Constraints: Do not cite cases. I will locate authority in a legal database. Flag any factual questions that could change the analysis.
Output: A table with columns Issue | What must be researched | Suggested search terms.</div>
<p><strong>Why it works:</strong> Guidance from the major model providers consistently stresses a clear task, relevant context, explicit constraints, and a stated response format. For complex prompts, headings or delimiters help separate instructions from source text.</p>
<div data-ex="fwA"></div>

<h3>Framework B: Goal + Scope + Definition of Done + Checkpoints</h3>
<p>Use this when the AI will reason across many sources, conduct deep research, or act as an agent.</p>
<div class="tablewrap"><table>
<tr><th>Component</th><th>What to specify</th></tr>
<tr><td><strong>Goal</strong></td><td>The legal question or work product you ultimately need.</td></tr>
<tr><td><strong>Scope</strong></td><td>Jurisdiction, court level, date range, source types, materials to use, and what is out of scope.</td></tr>
<tr><td><strong>Definition of done</strong></td><td>What a complete answer must contain.</td></tr>
<tr><td><strong>Checkpoints</strong></td><td>Places where the tool should pause, ask, show a plan, or identify uncertainty before proceeding.</td></tr>
</table></div>
<div class="prompt better"><span class="tag better">Example</span>
Goal: Prepare a research memo on whether an Oregon online retailer is subject to specific personal jurisdiction in Illinois federal court.
Scope: U.S. Supreme Court and Seventh Circuit authority, plus N.D. Ill. decisions since 2021; focus on internet-sales contacts and relatedness.
Definition of done: State the governing test, identify the strongest authorities on both sides, and list unresolved factual or legal questions.
Checkpoint: Before drafting the memo, show the research plan and identify any assumptions that could materially change the result.</div>
<div data-ex="fwB"></div>
<div class="callout"><strong>Don't ask for hidden chain-of-thought.</strong> Reasoning-capable systems generally don't need "think step by step." Instead, ask for the <em>analysis structure you need to review</em>: rule, application, counterarguments, citations, and unresolved questions, each set out separately.</div>
<div data-ex="fwChoice"></div>
<div data-ex="cot"></div>
`},
{ id:'legalai', title:'Prompting legal research AI', html:`
<h2>A generic framework for legal AI research products</h2>
<p class="lead">If you're using a legal research AI and don't have product-specific guidance, use this compact formula.</p>
<div class="card">
<h4 style="margin-top:0">Jurisdiction + Material Facts + One Legal Question + Source Scope + Verification</h4>
<ol>
<li><strong>Jurisdiction:</strong> Name the governing jurisdiction and, when relevant, the court level.</li>
<li><strong>Material facts and posture:</strong> Include only facts that affect the legal question, plus procedural posture when it matters.</li>
<li><strong>One legal question:</strong> Ask one discrete issue at a time when possible.</li>
<li><strong>Source scope:</strong> State any limits on authority: binding cases only, primary law, a date range, a statute, a regulation, or specific documents.</li>
<li><strong>Verification request:</strong> Ask for citations or links to the supporting authority, and ask the tool to identify uncertainty or gaps.</li>
</ol></div>
<div class="prompt better"><span class="tag better">Example</span>Under California law, may an employer enforce a customer non-solicitation clause against a former employee? The employee signed the agreement in 2023 and now works for a competitor. Focus on California Supreme Court and Courts of Appeal authority and the current text of Business and Professions Code § 16600. Provide linked citations to the authorities supporting each material proposition and flag any unresolved issue.</div>
<h3>Why this differs from a general chat prompt</h3>
<p>Purpose-built legal research tools often already know you want legal authority, and they may already control the answer format. Long personas, elaborate tone instructions, and multiple unrelated questions add noise. Precise jurisdiction, legally material facts, and a focused issue usually matter more.</p>
<div data-ex="diag"></div>
<div data-ex="rwLegal"></div>
`},
{ id:'tools', title:'Tool-specific patterns', html:`
<h2>Tool-specific prompting patterns</h2>
<p class="lead">Each major platform recommends a slightly different pattern. Pick a tool below.</p>
<div class="callout warn">Product interfaces change quickly. When a feature, source collection, or limit matters, check the current in-product help.</div>
<div class="tabs" id="tooltabs">
<button data-t="tw" class="on">Westlaw / CoCounsel</button><button data-t="tl">Lexis+ AI Protégé</button><button data-t="tb">Bloomberg Law</button><button data-t="th">Harvey</button><button data-t="tg">Legora</button>
</div>
<div class="tabpanel on" id="tw">
<h3>Westlaw / CoCounsel Legal / Westlaw Deep Research</h3>
<p><strong>Official Thomson Reuters framework: Intent + Context + Instruction.</strong></p>
<ul><li><strong>Intent:</strong> Why you need the result.</li><li><strong>Context:</strong> Relevant facts, case type, governing law, posture, or documents.</li><li><strong>Instruction:</strong> What the tool should do and, when useful, how to present the result.</li></ul>
<p>For Westlaw Deep Research and AI-Assisted Research, Thomson Reuters recommends <strong>clear, focused prompts of about one or two sentences</strong> in everyday language, not Boolean syntax. Include only material facts and focus on a single issue. Leave out proper names that aren't legally relevant, because they can distort retrieval.</p>
<div class="prompt better"><span class="tag better">Example</span>Under Texas law, does a party waive attorney-client privilege by disclosing privileged information to a transaction counterparty during due diligence when the parties have a nondisclosure agreement?</div>
<p><strong>Teaching note:</strong> CoCounsel Legal also supports broader plain-language requests that combine research, analysis, and drafting. For a multi-step assignment, use Goal + Scope + Definition of Done + Checkpoints instead of forcing everything into a one-sentence query.</p>
<p><strong>Verify:</strong> Open the linked primary authority, confirm the proposition and procedural posture, and run KeyCite or another appropriate citator before relying on the result.</p>
</div>
<div class="tabpanel" id="tl">
<h3>Lexis+ AI with Protégé</h3>
<p><strong>Official LexisNexis framework: the 5 P's.</strong></p>
<div class="tablewrap"><table>
<tr><th>P</th><th>Meaning in the LexisNexis guide</th></tr>
<tr><td><strong>Prime</strong></td><td>Gather the context, background, and constraints, including jurisdiction and key facts.</td></tr>
<tr><td><strong>Persona</strong></td><td>Define the relevant perspective, such as the client or addressee.</td></tr>
<tr><td><strong>Product</strong></td><td>Specify the desired output, such as format or length.</td></tr>
<tr><td><strong>Prompt</strong></td><td>Write clear, specific instructions using the relevant information above.</td></tr>
<tr><td><strong>Polish</strong></td><td>Refine the result conversationally through follow-up instructions.</td></tr>
</table></div>
<p>LexisNexis emphasizes specificity, context, jurisdiction, material facts, format, and audience, followed by iterative refinement. Don't try to perfect an oversized first prompt.</p>
<div class="prompt better"><span class="tag better">Example</span>Under the Bankruptcy Code, are restitution claims dischargeable in a Chapter 11 case involving a corporate debtor? Focus on Ninth Circuit authority. Summarize the rule and provide linked supporting authority.</div>
<div class="callout"><strong>Product cue:</strong> According to LexisNexis, an <strong>unlinked citation in a Protégé response</strong> means the source could not be verified in the LexisNexis database. Treat it as unverified and locate the authority independently.</div>
</div>
<div class="tabpanel" id="tb">
<h3>Bloomberg Law Answers and AI Assistant</h3>
<p>Bloomberg Law doesn't publish a named prompting acronym in the public guidance reviewed for this tutorial. Use this pattern: <strong>Focused Question → Jurisdiction → Follow-up → Verify.</strong></p>
<ul>
<li>Ask a focused legal question in natural language.</li>
<li>Use jurisdiction-specific filtering when available instead of embedding unnecessary geographic detail.</li>
<li>Use the AI Assistant for iterative research, source questions, summaries, and comparisons.</li>
<li>For multi-jurisdiction work, use the comparison/chart functionality when it fits.</li>
<li>Use inline citations and one-click links to inspect the source behind the answer.</li>
</ul>
<p>Bloomberg says Answers and AI Assistant are grounded in Bloomberg Law content and may abstain when the platform lacks supporting content or the request falls outside legal scope. That reduces some risks, but you still need to read and validate the authority.</p>
<div class="prompt better"><span class="tag better">Example</span>What test does the Ninth Circuit apply to determine whether an online platform has purposefully directed conduct at the forum state in a trademark case?</div>
<p>Then narrow with a follow-up:</p>
<div class="prompt better"><span class="tag better">Follow-up</span>Limit the answer to published Ninth Circuit decisions from 2020 forward and compare the cases by the online conduct the court found sufficient or insufficient.</div>
</div>
<div class="tabpanel" id="th">
<h3>Harvey</h3>
<p>For routine prompts, Harvey's help center recommends <strong>Request + Context + Output.</strong></p>
<ul><li><strong>Request:</strong> State the legal task clearly.</li><li><strong>Context:</strong> Identify the relevant documents, matter background, audience, jurisdiction, and issues.</li><li><strong>Output:</strong> Specify the form and style of the response.</li></ul>
<p>Harvey also publishes the <strong>CLAIM</strong> framework (Context, Legal task, Audience, Instructions, Mode of output) for broader legal work. Treat CLAIM as the expanded version of Request + Context + Output, not a separate framework to memorize.</p>
<div class="prompt better"><span class="tag better">Example</span>Request: Compare the assignment clauses in the three uploaded agreements.
Context: We represent the buyer in a California asset acquisition and need to identify any consent requirements that could delay closing.
Output: Create a table with Agreement | Consent required? | Triggering language | Relevant quotation | Follow-up question. Enter "Not found" when the document does not address the issue.</div>
<p><strong>Tips:</strong> Ground prompts in uploaded sources. Refer to document names or sections rather than page numbers. Name jurisdictions explicitly. Break complex requests into focused stages. Use words such as "brief," "concise," "detailed," or "thorough" rather than a fixed page count.</p>
</div>
<div class="tabpanel" id="tg">
<h3>Legora</h3>
<p>Legora combines legal research, document review, workflows, and an agent that can plan and carry out multi-step legal work. Its public materials don't name a single prompting acronym, so match your pattern to the mode: <strong>Source + Goal + Deliverable + Review Point.</strong></p>
<ul><li><strong>Source:</strong> Select or identify the research source or documents the answer should use.</li><li><strong>Goal:</strong> State the legal question or work objective.</li><li><strong>Deliverable:</strong> Specify the memo, table, comparison, draft, or extraction you need.</li><li><strong>Review point:</strong> For agentic tasks, review the proposed plan and other judgment points before accepting the final work product.</li></ul>
<p>In <strong>Tabular Review</strong>, each prompt works like a column question. Ask one extractable question per column and specify the answer format.</p>
<div class="prompt better"><span class="tag better">Column</span>Does this agreement contain a change-of-control provision? Answer Yes or No and quote the operative language.</div>
<div class="prompt better"><span class="tag better">Column</span>What notice period applies to termination for convenience? Return the number of days and quote the clause. If not found, return "Not found."</div>
<p>For the <strong>Agent</strong>, give the objective and boundaries. Then review the plan and the final sources rather than prescribing every intermediate action.</p>
</div>

{ id:'general', title:'General AI & documents', html:`
<h2>What general-purpose AI is good for</h2>
<p class="lead">General-purpose AI can help before, during, and after database research.</p>
<ul>
<li>Brainstorming possible issues, elements, defenses, and factual questions</li>
<li>Generating synonyms, terms of art, and natural-language or Boolean search ideas</li>
<li>Explaining unfamiliar doctrine as an orientation step</li>
<li>Summarizing or comparing documents that you provide</li>
<li>Turning verified research into an outline, chart, or draft</li>
<li>Stress-testing an argument by identifying counterarguments or missing facts</li>
</ul>
<div class="callout warn">Don't treat a case name, quotation, citation, statute, or statement of current law from a general-purpose model as verified just because the answer sounds confident. Even if the model has web access or connectors, you still need to inspect the underlying authority and confirm it is still good law.</div>
<h3>Better than "show your reasoning"</h3>
<p>Ask for an auditable structure instead:</p>
<div class="prompt better">State the rule you are applying, identify the source for the rule, apply it to the facts, identify the strongest counterargument, and list any factual or legal issue that still requires research.</div>
<p>That gives you something you can evaluate, without asking the model to reveal hidden internal reasoning.</p>
<div data-ex="genUses"></div>
<div data-ex="genCite"></div>
<h2 style="margin-top:2.5rem">Prompting with documents and long source material</h2>
<p>When the task depends on documents you provide:</p>
<ul>
<li>Identify which documents the model should use and what each is for.</li>
<li>Separate source text from instructions with headings, labels, or delimiters.</li>
<li>For long inputs, place the source material before the final question when the product supports that workflow.</li>
<li>Ask for quotations or pinpoint references when you need to trace a statement back to the source.</li>
<li>Tell the model what to do when the source is silent. For example: "If the document does not answer the question, say 'Not found' rather than inferring."</li>
<li>When comparing many documents, define the categories before asking for a table.</li>
</ul>
<p>Document-grounded exercises are useful for learning because you can compare the AI's summary to the actual text and practice spotting omissions, overstatement, and unsupported inference.</p>
<div data-ex="rwDocs"></div>
`},
{ id:'failures', title:'Common prompting failures', html:`
<h2>Common prompting failures</h2>
<h3>False premise</h3>
<div class="prompt weak"><span class="tag weak">Weak</span>Why did the court hold that the clause was unenforceable?</div>
<p>This assumes the holding. A model may accept the premise instead of correcting it.</p>
<div class="prompt better"><span class="tag better">Better</span>What did the court hold about the enforceability of the clause? Quote or cite the portion of the opinion that states the holding.</div>
<h3>Too many issues at once</h3>
<div class="prompt weak"><span class="tag weak">Weak</span>Research personal jurisdiction, venue, removal, statute of limitations, and damages and tell me whether we will win.</div>
<p><strong>Better:</strong> Break the assignment into separate research questions, or give an agent a scoped research brief with a definition of done.</p>
<h3>Irrelevant facts</h3>
<p>Facts that don't change the legal issue can skew retrieval. Include a fact because it affects doctrine, posture, remedy, authority, or terminology, not just because it's part of the story.</p>
<h3>Vague source request</h3>
<div class="prompt weak"><span class="tag weak">Weak</span>Give me the law.</div>
<div class="prompt better"><span class="tag better">Better</span>Identify controlling Ninth Circuit and U.S. Supreme Court authority. If no controlling authority resolves the issue, identify persuasive federal authority and label it as persuasive.</div>
<h3>Overreliance on model "confidence"</h3>
<p>A confidence label is not a citator, and it isn't evidence that a proposition is correct. Prefer source-backed explanations, explicit uncertainty, and independent verification.</p>
<div data-ex="failMatch"></div>
<div data-ex="rwPremise"></div>
<div data-ex="rwMany"></div>
`},
{ id:'verify', title:'Verification', html:`
<h2>Verification: the step no prompt can replace</h2>
<p class="lead">A 2024 Stanford RegLab study evaluated then-current versions of Lexis+ AI, Westlaw AI-Assisted Research, and Ask Practical Law AI. It found hallucinations in roughly <strong>17% to 33% of responses</strong>, depending on the system and task.</p>
<p>The study predates many current product versions, so don't treat those percentages as present-day performance estimates. The lasting lesson is that retrieval grounding lowers the risk of hallucination but doesn't eliminate it.</p>
<h3>Verification loop</h3>
<p>For every material legal proposition produced by AI:</p>
<ol>
<li><strong>Open the source.</strong> Confirm that the cited case, statute, regulation, or rule exists.</li>
<li><strong>Read the relevant language.</strong> Make sure the source actually supports the proposition and that quotations are accurate.</li>
<li><strong>Check authority.</strong> Is it controlling, persuasive, or secondary? Are the court level and jurisdiction correct?</li>
<li><strong>Update the law.</strong> Use KeyCite, Shepard's, BCite, or another appropriate citator. Check the current version of statutes, regulations, and rules.</li>
<li><strong>Check context.</strong> Confirm procedural posture, factual similarity, exceptions, and later developments.</li>
<li><strong>Search for what is missing.</strong> A plausible answer can omit adverse or controlling authority.</li>
<li><strong>Record the verified sources.</strong> Your research trail should survive even if the AI chat does not.</li>
</ol>
<div data-ex="stanford"></div>
<h3>Practice: audit a simulated AI response</h3>
<p>A student asked a legal research AI the § 16600 non-solicitation question from Lesson 4. Below is a <strong>simulated</strong> response. <em>All case names are fictional.</em> Underlined text marks a linked citation; <span class="nolk" style="background:var(--warn-soft)">highlighted text</span> marks an unlinked one.</p>
<div class="sim">
<p><strong>[A]</strong> Business and Professions Code <span class="lk">§ 16600</span> voids contracts that restrain anyone from engaging in a lawful profession, trade, or business, subject to statutory exceptions. <em>(The response quotes statutory text retrieved from an older database snapshot.)</em></p>
<p><strong>[B]</strong> In <span class="lk"><em>Harlow v. Brightline Staffing</em> (Cal. Ct. App. 2023, unpublished)</span>, the court held that customer non-solicitation clauses are void.</p>
<p><strong>[C]</strong> <em>See also</em> <span class="nolk"><em>Mercer v. Tidewater Analytics</em>, 17 Cal.5th 402 (2024)</span>.</p>
<p><strong>[D]</strong> The <em>Harlow</em> court stated that "every non-solicitation clause is per se invalid in all circumstances." <span class="lk">[link]</span></p>
<p><strong>[E]</strong> In <span class="lk"><em>Dalton v. Orchard Systems</em></span>, the court enjoined a former employee from soliciting customers. <em>(The ruling was a preliminary injunction based on the employee's misuse of trade secrets.)</em></p>
<p><strong>[F]</strong> No California authority permits enforcement of any customer non-solicitation provision.</p>
<p><strong>Confidence: High</strong></p>
</div>
<div data-ex="simResp"></div>
<div data-ex="confidence"></div>
<div data-ex="record"></div>
`},
{ id:'ethics', title:'Confidentiality & ethics', html:`
<h2>Confidentiality, ethics, and institutional rules</h2>
<p class="lead">Before you enter nonpublic information into an AI system, follow the rules of your school, clinic, employer, court, and database provider.</p>
<p><strong>ABA Formal Opinion 512 (2024)</strong> addresses lawyers' duties when using generative AI, including competence, confidentiality, communication, supervision, candor, meritorious claims, and reasonable fees. It is guidance interpreting the ABA Model Rules, not binding law in itself. State rules and court orders may differ.</p>
<div class="tablewrap"><table>
<tr><th>Duty</th><th>Key point</th></tr>
<tr><td><strong>Competence</strong></td><td>Understand enough about the tool's capabilities and limitations to use it and review its output appropriately.</td></tr>
<tr><td><strong>Confidentiality</strong></td><td>Before entering information relating to a client representation, evaluate the product's terms, security, retention, access, and training/use of inputs. Informed consent may be required depending on the circumstances, and generic boilerplate may not be enough for meaningful informed consent.</td></tr>
<tr><td><strong>Verification &amp; candor</strong></td><td>Lawyers remain responsible for legal and factual assertions submitted to a tribunal. AI doesn't shift that responsibility.</td></tr>
<tr><td><strong>Supervision</strong></td><td>Lawyers must appropriately supervise subordinate lawyers, nonlawyer staff, and technology-assisted work.</td></tr>
<tr><td><strong>Communication</strong></td><td>Whether a client must be told about AI use depends on the circumstances, including whether it affects the means of representation or risks disclosure of client information.</td></tr>
<tr><td><strong>Fees</strong></td><td>Lawyers may bill for actual legal work and review consistent with applicable rules. They generally may not bill a client for ordinary time spent learning a tool for their general practice.</td></tr>
</table></div>
<div class="callout"><strong>Safest default for class exercises:</strong> Use hypothetical or public facts unless an approved system and your course policy expressly permit otherwise.</div>
<div data-ex="eth1"></div>
<div data-ex="eth2"></div>
<div data-ex="eth3"></div>
<div data-ex="eth4"></div>

{ id:'reference', title:'Quick reference & sources', html:`
<h2>Quick-reference prompt templates</h2>
<h4>General-purpose AI</h4>
<div class="prompt" id="tpl1">Task: [what you want done]
Context: [jurisdiction, facts, documents, audience, purpose]
Constraints: [source limits, assumptions, confidentiality limits, what not to infer]
Output: [table, search plan, memo outline, comparison, etc.]</div>
<button class="btn sec" data-copy="tpl1">Copy</button>
<h4>Generic legal research AI</h4>
<div class="prompt" id="tpl2">In [jurisdiction/court], [one legal question]. Material facts/posture: [facts]. Limit the research to [source scope/date range]. Provide linked citations or source references for material propositions and identify any uncertainty, missing authority, or issue requiring further research.</div>
<button class="btn sec" data-copy="tpl2">Copy</button>
<h4>Agentic / deep research tool</h4>
<div class="prompt" id="tpl3">Goal: [final research objective]
Scope: [jurisdiction, sources, date range, documents, exclusions]
Definition of done: [what the final answer must include]
Checkpoint: [show plan / ask before changing scope / flag unresolved assumptions]
Deliverable: [memo/table/report with citation requirements]</div>
<button class="btn sec" data-copy="tpl3">Copy</button>
<h4>Framework cheat sheet</h4>
<div class="tablewrap"><table>
<tr><th>Tool / situation</th><th>Pattern</th></tr>
<tr><td>General-purpose AI</td><td>Task + Context + Constraints + Output</td></tr>
<tr><td>Agents / deep research</td><td>Goal + Scope + Definition of Done + Checkpoints</td></tr>
<tr><td>Legal research AI (generic)</td><td>Jurisdiction + Material Facts + One Legal Question + Source Scope + Verification</td></tr>
<tr><td>Westlaw / CoCounsel</td><td>Intent + Context + Instruction; research prompts about 1–2 sentences</td></tr>
<tr><td>Lexis+ AI Protégé</td><td>5 P's: Prime, Persona, Product, Prompt, Polish</td></tr>
<tr><td>Bloomberg Law</td><td>Focused Question → Jurisdiction → Follow-up → Verify</td></tr>
<tr><td>Harvey</td><td>Request + Context + Output (expanded: CLAIM)</td></tr>
<tr><td>Legora</td><td>Source + Goal + Deliverable + Review Point; Tabular Review: one question per column</td></tr>
</table></div>

const ISSUES=['personal jurisdiction','venue','removal','statute of limitations','limitations','damages','class certification','summary judgment','discovery','standing','preemption','arbitration','sanctions','attorney fees','attorney\'s fees','injunction','work product','claw','should we sue','whether we will win','our odds'];
const NAME_STOP=new Set(['New','York','Jersey','Mexico','Hampshire','North','South','West','Rhode','Island','Carolina','Dakota','Virginia','Supreme','Court','Circuit','United','States','District','Code','Business','Professions','Labor','Bankruptcy','Ninth','Seventh','Under','Superior','Appeal','Appeals','Federal','Rules','Civil','Procedure','Deep','Research','Westlaw','Lexis','Harvey','Legora','Bloomberg','Law','Goal','Scope','Task','Context','Output','Checkpoint','Definition','Request','Deliverable','Constraints','Not','Found','Commerce','Clause','Model','Practical','Commissioner','Protégé']);
function words(t){return (t.trim().match(/\S+/g)||[]).length}
function sentences(t){return t.split(/[.?!]+(\s|$)/).filter(s=>s&&s.trim().length>3).length}
function qmarks(t){return (t.match(/\?/g)||[]).length}
function issueCount(t){const l=t.toLowerCase();let n=0;const seen=new Set();ISSUES.forEach(i=>{if(l.includes(i)){const k=i.replace(/'s/,'');if(!seen.has(k)){seen.add(k);n++}}});return n}
function hasNames(t){
  if(/\b(Mr|Ms|Mrs|Dr)\.?\s+[A-Z]/.test(t)) return true;
  if(/\b(my|our) client,?\s+[A-Z][a-z]+/.test(t)) return true;
  const re=/\b([A-Z][a-z]+)\s+([A-Z][a-z]+)\b/g; let m;
  while((m=re.exec(t))){ if(!NAME_STOP.has(m[1])&&!NAME_STOP.has(m[2])){ const before=t.slice(Math.max(0,m.index-2),m.index); if(!/[.?!:]\s$/.test(before)&&m.index!==0) return true; } }
  if(/\b(Inc|LLC|Corp|Ltd)\b\.?/.test(t)) return true;
  return false;
}
const CHECKS={
 task:{label:'States a clear task or question',test:t=>RE.task.test(t),good:'You tell the tool what to do.',bad:'Lead with a clear verb or question: identify, compare, summarize, or "Under ___ law, does…?"'},
 context:{label:'Supplies relevant context',test:t=>RE.facts.test(t)||RE.jur.test(t)||RE.docs.test(t),good:'You give the tool facts, documents, or purpose to work with.',bad:'Add the jurisdiction, key facts, documents, audience, or purpose.'},
 constraints:{label:'Sets constraints or boundaries',test:t=>RE.constraint.test(t),good:'You set boundaries (e.g., "do not cite cases," "use only…").',bad:'Add boundaries: source limits, what not to infer, or "do not invent or cite cases."'},
 output:{label:'Specifies the output format',test:t=>RE.output.test(t),good:'You say what form the answer should take.',bad:'Specify the output: a table (with columns), list, outline, memo, or search plan.'},
 jurisdiction:{label:'Names the jurisdiction / court',test:t=>RE.jur.test(t),good:'Jurisdiction is explicit.',bad:'Name the governing jurisdiction and, if relevant, the court level (e.g., "Under California law," "Ninth Circuit").'},
 facts:{label:'Includes material facts or posture',test:t=>RE.facts.test(t)&&words(t)>=12,good:'You include facts that shape the legal question.',bad:'Add only the facts that affect the legal question (relationship, key event, timing, posture).'},
 oneq:{label:'Focuses on one legal question',test:t=>qmarks(t)<=1&&issueCount(t)<3,good:'One discrete issue.',bad:'You seem to ask more than one question. Split them into separate prompts or follow-ups.'},
 scope:{label:'Defines the source scope',test:t=>RE.scope.test(t),good:'You limit the authority (courts, dates, statutes, or documents).',bad:'Add source scope: binding/controlling authority, specific courts, a date range, or a named statute.'},
 verify:{label:'Asks for citations/links and flags uncertainty',test:t=>RE.verify.test(t),good:'You ask for support you can check.',bad:'Ask for linked citations for material propositions and for uncertainty or gaps to be flagged.'},
 brief:{label:'Stays short (about 1–2 sentences)',test:t=>sentences(t)<=2&&words(t)<=60,good:'Concise, as Thomson Reuters recommends for AI research.',bad:'Trim to one or two sentences (roughly 60 words or fewer). Keep only material facts.'},
 nobool:{kind:'caution',label:'Uses natural language, not Boolean',test:t=>!RE.bool.test(t),good:'Plain language.',bad:'Remove Boolean connectors (AND, /s, !). AI research tools want everyday language.'},

 categories:{label:'Defines categories or columns',test:t=>RE.categories.test(t),good:'Categories are defined before the table.',bad:'Define the categories or columns you want (e.g., "Lease | Responsibility | Notice | Deadline").'},
 delim:{kind:'tip',label:'Separates instructions from source text',test:t=>RE.delim.test(t),good:'You use labels or delimiters.',bad:'Tip: label the source text (e.g., [LEASE A] …) so instructions and source stay separate.'},
 answerfmt:{label:'Specifies the answer format',test:t=>RE.answerfmt.test(t),good:'The column has a defined answer format.',bad:'Specify the answer format (e.g., "Answer Yes or No," "Return the number of days").'},
 onecol:{label:'Asks one extractable question',test:t=>qmarks(t)<=1&&words(t)<=60,good:'One question per column.',bad:'A column should ask one extractable question. Split this into separate columns.'},
 nopages:{kind:'caution',label:'Uses length words, not page counts',test:t=>!RE.pages.test(t),good:'No fixed page count.',bad:'Harvey recommends "brief," "concise," "detailed," or "thorough" rather than page counts.'},
 goal:{label:'States the Goal',test:t=>RE.goal.test(t),good:'The final objective is clear.',bad:'State the final research objective or work product you need.'},
 gscope:{label:'Defines the Scope',test:t=>RE.scope.test(t)&&RE.jur.test(t),good:'Jurisdiction and sources are bounded.',bad:'Define scope: jurisdiction, court level, date range, sources, and what is out of scope.'},
 dod:{label:'Includes a Definition of Done',test:t=>RE.dod.test(t),good:'You say what a complete answer contains.',bad:'Add a definition of done: what must the final answer include?'},

 brieftip:{kind:'tip',label:'Focused and concise',test:t=>sentences(t)<=2&&words(t)<=60,good:'Concise.',bad:'Tip: start focused, then narrow with follow-ups (dates, court, comparison).'}

function analyze(text,toolKey){
  const tool=TOOLS[toolKey]; const t=text.trim();
  const res=tool.checks.map(k=>{const c=CHECKS[k];return {k,c,pass:!!c.test(t)}});
  const core=res.filter(r=>!r.c.kind); const corePass=core.filter(r=>r.pass).length;
  const cautions=res.filter(r=>r.c.kind==='caution'&&!r.pass).length;
  const ratio=core.length?corePass/core.length:1;
  let cls,label;
  if(ratio===1&&cautions===0){cls='good';label='Strong structure: all core elements present.'}
  else if(ratio>=.6){cls='mid';label='Developing: '+corePass+' of '+core.length+' core elements present'+(cautions?', plus '+cautions+' thing'+(cautions>1?'s':'')+' to watch':'')+'.'}
  else {cls='low';label='Needs work: '+corePass+' of '+core.length+' core elements present.'}
  let html='<div class="rating '+cls+'">'+label+'</div><ul class="rub">';
  res.forEach(r=>{
    let ic,cl;
    if(r.c.kind==='tip'){ic=r.pass?'✓':'ℹ';cl=r.pass?'ok':'tip'}
    else if(r.c.kind==='caution'){ic=r.pass?'✓':'!';cl=r.pass?'ok':'w'}
    else {ic=r.pass?'✓':'✗';cl=r.pass?'ok':'no'}
    html+='<li><span class="ic '+cl+'">'+ic+'</span><span><strong>'+r.c.label+'.</strong> '+(r.pass?r.c.good:r.c.bad)+'</span></li>';
  });
  html+='</ul><p class="small">This feedback comes from automated pattern checks. It can miss good phrasing or be fooled by keywords, and it doesn’t judge legal accuracy. Compare your draft with the model and use your own judgment.</p>';
  return html;
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function markDone(id){ if(!state.done[id]){state.done[id]=true; const el=document.querySelector('[data-ex="'+id+'"]'); if(el) el.classList.add('is-done'); updateProgress();} }
function head(ex,label){return '<div class="ex-h"><span>'+label+'</span><span class="done">✓ Completed</span></div>'+(ex.title?'<h4 style="margin:0 0 6px">'+ex.title+'</h4>':'')}

function shuffledIdx(n,avoid){
  // random permutation of 0..n-1 that differs from the original order;
  // "avoid" adds a penalty so correct answers don't line up with their items
  const base=[...Array(n).keys()]; let best=null,bestScore=1e9;
  for(let tries=0;tries<60;tries++){
    const a=base.slice();
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    let score=a.filter((v,i)=>v===i).length*2; if(avoid) score+=avoid(a);
    if(n>1&&a.every((v,i)=>v===i)) score+=100;
    if(score<bestScore){best=a;bestScore=score;} if(score===0) break;
  }
  return best;
}
function renderMCQ(el,id,ex){
  el.innerHTML=head(ex,'Check your understanding')+'<p class="q">'+ex.q+'</p>'+ex.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'<div class="fb"></div>';
  const fb=$('.fb',el);
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=ex.opts[+b.dataset.i];
    el.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));
    b.classList.add(o.ok?'right':'wrong');
    fb.className='fb show '+(o.ok?'good':'bad');
    fb.innerHTML=(o.ok?'<strong>Correct.</strong> ':'<strong>Not quite.</strong> ')+esc(o.fb)+(o.ok?'':' Try again.');
    if(o.ok) markDone(id);
  });
}
function renderMulti(el,id,ex){
  el.innerHTML=head(ex,'Select all that apply')+(ex.pre||'')+'<p class="q">'+ex.q+'</p>'+ex.opts.map((o,i)=>{return '<label class="chk" data-i="'+i+'"><input type="checkbox"><span>'+esc(o.t)+'<div class="itemfb">'+esc(o.fb)+'</div></span></label>'}).join('')+'<div class="btns"><button class="btn chkbtn">Check answers</button></div><div class="fb"></div>';
  $('.chkbtn',el).onclick=()=>{
    let right=0;
    el.classList.add('checked');
    el.querySelectorAll('label.chk').forEach(l=>{
      const o=ex.opts[+l.dataset.i]; const on=$('input',l).checked;
      l.classList.remove('right','wrong');
      const ok=(on===o.ok); if(ok) right++;
      l.classList.add(ok?'right':'wrong');
    });
    const fb=$('.fb',el); const all=right===ex.opts.length;
    fb.className='fb show '+(all?'good':'bad');
    fb.innerHTML=all?'<strong>All correct.</strong> Read the notes under each option.':'<strong>'+right+' of '+ex.opts.length+' judged correctly.</strong> Red items were either missed or wrongly selected. Read the notes, adjust, and check again.';
    if(all) markDone(id);
  };
}
function renderMatch(el,id,ex){
  const itemOrder=shuffledIdx(ex.items.length,a=>a.filter((it,pos)=>ex.choices[pos]===ex.items[it].a).length*3);
  // questions are shuffled; the answer list stays in its original order
  const opts='<option value="">Choose…</option>'+ex.choices.map(c=>'<option>'+esc(c)+'</option>').join('');
  el.innerHTML=head(ex,'Match')+(ex.pre||'')+'<p class="q">'+ex.q+'</p>'+itemOrder.map(i=>'<div class="mrow" data-i="'+i+'"><div class="it">'+esc(ex.items[i].t)+'</div><select aria-label="Answer">'+opts+'</select><div class="itemfb"></div></div>').join('')+'<div class="btns"><button class="btn chkbtn">Check answers</button></div><div class="fb"></div>';
  $('.chkbtn',el).onclick=()=>{
    let right=0; el.classList.add('checked');
    el.querySelectorAll('.mrow').forEach(r=>{
      const it=ex.items[+r.dataset.i]; const v=$('select',r).value;
      r.classList.remove('right','wrong');
      const ok=v===it.a; if(ok) right++;
      r.classList.add(ok?'right':'wrong');
      $('.itemfb',r).innerHTML=ok?'✓ '+esc(it.fb):(v?'✗ Not this one. ':'✗ No answer selected. ')+'Hint: '+esc(it.fb);
    });
    const fb=$('.fb',el); const all=right===ex.items.length;
    fb.className='fb show '+(all?'good':'bad');
    fb.innerHTML=all?'<strong>All correct.</strong>':'<strong>'+right+' of '+ex.items.length+' correct.</strong> Use the hints and try again.';
    if(all) markDone(id);
  };
}
function renderRewrite(el,id,ex){
  const tool=TOOLS[ex.tool];
  el.innerHTML=head(ex,'Write & get feedback')+(ex.pre||'')+'<p class="q">'+ex.q+'</p>'+(tool.fw&&ex.tool!=='premise'?'<div class="fwhint"><strong>Target:</strong> '+esc(tool.name)+' • <strong>Framework:</strong> '+esc(tool.fw)+'</div>':'')+'<textarea placeholder="Write your prompt here…"></textarea><div class="btns"><button class="btn an">Get feedback</button><button class="btn sec md">Show model answer</button></div><div class="result"></div><div class="fb neutral mdl"><strong>One strong version</strong> (yours can differ and still be good):<div class="prompt better">'+esc(ex.model)+'</div></div>';
  const ta=$('textarea',el);
  ta.oninput=()=>{state.texts[id]={label:ex.title,q:ex.q,text:ta.value}};
  $('.an',el).onclick=()=>{
    const r=$('.result',el);
    if(words(ta.value)<5){r.className='result show';r.innerHTML='<div class="rating low">Write a bit more first (at least a sentence) and then ask for feedback.</div>';return}
    r.className='result show'; r.innerHTML=analyze(ta.value,ex.tool); markDone(id);
  };
  $('.md',el).onclick=()=>{$('.mdl',el).classList.toggle('show')};
}

  sc.onchange=upd; tl.onchange=upd; ta.oninput=save;

    r.className='result show'; r.innerHTML=analyze(ta.value,tl.value); markDone(id); save();

function copyText(txt,btn){
  const done=()=>{const o=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=o,1400)};
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallback()); }catch(e){fallback()}
  function fallback(){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();done()}
}

function updateProgress(){
  const all=Object.keys(EX); const d=all.filter(k=>state.done[k]).length;
  $('#progtxt').textContent=d+' / '+all.length+' exercises';
  $('#progbar').style.width=(100*d/all.length)+'%';
  MODULES.forEach(m=>{
    const ids=[...document.querySelectorAll('#m-'+m.id+' [data-ex]')].map(e=>e.dataset.ex);
    const c=$('#c-'+m.id); if(!ids.length){c.textContent='';return}
    const n=ids.filter(k=>state.done[k]).length; c.textContent=n===ids.length?'✓':n+'/'+ids.length;
  });
}
$('#dlbtn').onclick=()=>{
  const entries=Object.values(state.texts).filter(e=>e.text&&e.text.trim());
  let out;
  if(!entries.length){out='You haven’t written any prompts yet. Your writing exercises will appear here once you do.'}
  else{
    out='PROMPTING AI FOR LEGAL RESEARCH – MY WORK\n'+new Date().toLocaleString()+'\nExercises completed: '+Object.keys(state.done).length+' of '+Object.keys(EX).length+'\n\n';
    entries.forEach(e=>{out+='==== '+e.label+' ====\nTask: '+e.q.replace(/<[^>]+>/g,'')+'\n\n'+e.text.trim()+'\n\n'});
  }
  $('#worktext').value=out; $('#workpanel').hidden=false; $('#workcopy').focus();
};
$('#workclose').onclick=()=>{$('#workpanel').hidden=true};
$('#workpanel').onclick=e=>{if(e.target.id==='workpanel')$('#workpanel').hidden=true};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#workpanel').hidden=true});
$('#workcopy').onclick=()=>{const t=$('#worktext');t.select();copyText(t.value,$('#workcopy'))};
show(0); updateProgress();
</script>

</body></html>
